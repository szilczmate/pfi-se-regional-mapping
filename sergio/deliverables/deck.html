<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pfizer Sweden Regional Landscape Mapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1B2944; --navy-soft:#334260;
    --gray-1:#6B7280; --gray-2:#9CA3AF; --gray-3:#D1D5DB;
    --bg-page:#ECEFF3; --bg-card:#FFFFFF; --bg-tint:#E8F4FB;
    --accent:#2A9DD0; --accent-d:#1A7CA8; --accent-l:#BCE3F2; --accent-xl:#F0FAFE;
    --line:#E5E9EF; --hl:#F4F8FB;
    --warn:#DC2626; --warn-l:#FEE2E2;
    --gold:#D97706; --gold-l:#FEF3C7;
    --good:#15803D; --good-l:#DCFCE7;
    --shadow:0 2px 8px rgba(20,30,60,0.06); --shadow-h:0 4px 16px rgba(20,30,60,0.10);
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{height:100%; overflow:hidden; font-family:'Inter',system-ui,sans-serif; background:var(--bg-page); color:var(--navy); -webkit-font-smoothing:antialiased;}
  #stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .slide{width:1280px; height:720px; background:white; box-shadow:0 20px 60px rgba(20,30,60,0.20); transform-origin:center center; position:absolute; display:none; flex-direction:column; overflow:hidden;}
  .slide.active{display:flex;}
  .topbar{height:4px; background:var(--accent); flex-shrink:0;}
  .conf-strip{height:22px; display:flex; align-items:center; justify-content:center; color:var(--gray-1); font-size:10px; letter-spacing:0.05em; flex-shrink:0;}
  .body{flex:1; padding:28px 60px 0 60px; display:flex; flex-direction:column; overflow:hidden;}
  .section-label{font-size:11px; font-weight:600; letter-spacing:0.18em; color:var(--accent); margin-bottom:8px; text-transform:uppercase;}
  .slide-title{font-size:36px; font-weight:700; color:var(--navy); line-height:1.1; margin-bottom:6px;}
  .slide-subtitle{font-size:14px; color:var(--gray-1); margin-bottom:22px; line-height:1.45;}
  .foot{height:36px; flex-shrink:0; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 60px; font-size:9.5px; color:var(--gray-2);}
  .foot .center{letter-spacing:0.1em; text-transform:uppercase; color:var(--gray-1);}
  .foot .brand{font-weight:600; color:var(--accent); letter-spacing:0.08em; text-transform:uppercase; font-size:10px;}
  .cover-bg{flex:1; background:radial-gradient(circle at 80% 20%,rgba(42,157,208,0.08) 0%,transparent 50%),radial-gradient(circle at 20% 80%,rgba(42,157,208,0.05) 0%,transparent 50%),linear-gradient(180deg,white 0%,#FAFCFD 100%); display:flex; flex-direction:column; justify-content:center; padding:0 100px; position:relative;}
  .cover-eyebrow{font-size:12px; letter-spacing:0.2em; color:var(--accent); font-weight:600; margin-bottom:18px; text-transform:uppercase;}
  .cover-title{font-size:60px; font-weight:800; color:var(--navy); line-height:1.05; margin-bottom:24px; max-width:900px;}
  .cover-sub{font-size:22px; color:var(--navy-soft); line-height:1.4; margin-bottom:60px; font-weight:400; max-width:850px;}
  .cover-meta{display:flex; gap:50px;}
  .cover-meta-item .label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--gray-1); font-weight:600; margin-bottom:6px;}
  .cover-meta-item .val{font-size:15px; color:var(--navy); font-weight:600;}
  .cover-accent-bar{position:absolute; bottom:0; left:0; width:250px; height:6px; background:var(--accent);}
  .tldr-row{display:grid; grid-template-columns:repeat(5,1fr); gap:16px; flex:1; align-content:center;}
  .tldr-card{background:white; border-left:4px solid var(--accent); border-radius:4px; box-shadow:var(--shadow); padding:24px 20px; display:flex; flex-direction:column; justify-content:space-between; min-height:340px;}
  .tldr-num{font-size:56px; font-weight:800; color:var(--navy); line-height:1; margin-bottom:6px; font-variant-numeric:tabular-nums;}
  .tldr-num .unit{font-size:24px; color:var(--accent); font-weight:600; margin-left:2px;}
  .tldr-headline{font-size:14px; color:var(--navy); font-weight:600; line-height:1.3; margin-bottom:12px;}
  .tldr-detail{font-size:11.5px; color:var(--gray-1); line-height:1.55;}
  .tldr-tag{display:inline-block; background:var(--accent-l); color:var(--accent-d); padding:2px 8px; border-radius:3px; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700; margin-bottom:14px;}
  .struct-wrapper{flex:1; display:flex; flex-direction:column; gap:14px; padding-bottom:16px;}
  .struct-tier{display:flex; flex-direction:column; align-items:center;}
  .struct-tier-label{font-size:10px; letter-spacing:0.14em; color:var(--gray-1); text-transform:uppercase; margin-bottom:8px; font-weight:600;}
  .national-row{display:flex; gap:14px; width:100%; justify-content:center;}
  .national-box{flex:0 1 280px; background:linear-gradient(180deg,var(--accent),var(--accent-d)); color:white; padding:14px 22px; border-radius:6px; text-align:center;}
  .national-box .name{font-size:16px; font-weight:700; margin-bottom:4px;}
  .national-box .desc{font-size:11px; opacity:0.9; line-height:1.4;}
  .svr-row{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; width:100%;}
  .svr-box{background:white; border:1.5px solid var(--accent); border-radius:5px; padding:10px 8px; text-align:center;}
  .svr-name{font-size:12px; font-weight:700; color:var(--navy); margin-bottom:4px;}
  .svr-count{font-size:9.5px; color:var(--accent-d); font-weight:600; text-transform:uppercase; letter-spacing:0.05em;}
  .svr-regions{font-size:9.5px; color:var(--gray-1); line-height:1.45; margin-top:5px;}
  .struct-callout{background:var(--bg-tint); border-left:3px solid var(--accent); padding:12px 18px; border-radius:3px; display:flex; gap:24px; align-items:center;}
  .struct-callout .lead{font-size:13px; font-weight:700; color:var(--navy);}
  .struct-callout .body-text{font-size:12px; color:var(--navy-soft); line-height:1.45; flex:1;}
  .struct-callout .stat{font-size:22px; font-weight:800; color:var(--accent-d); flex-shrink:0;}
  .struct-connector{width:1.5px; height:14px; background:var(--accent); margin:0 auto; opacity:0.4;}
  .scoretable-wrap{flex:1; overflow-y:auto; display:flex; flex-direction:column; padding-bottom:6px;}
  table.scoretable{width:100%; border-collapse:collapse; font-size:11px;}
  table.scoretable thead th{background:var(--navy); color:white; text-align:left; padding:9px 10px; font-weight:600; font-size:10.5px; letter-spacing:0.04em; cursor:pointer; user-select:none; position:sticky; top:0;}
  table.scoretable thead th:hover{background:var(--navy-soft);}
  table.scoretable thead th.numeric{text-align:right;}
  table.scoretable tbody td{padding:7px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; color:var(--navy);}
  table.scoretable tbody td.numeric{text-align:right;}
  table.scoretable tbody tr:hover td{background:var(--hl);}
  .archetype-pill{display:inline-block; padding:2px 7px; border-radius:11px; font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.02em;}
  .arch-academic{background:#DBEAFE; color:#1E40AF;}
  .arch-rare{background:#FEF3C7; color:#92400E;}
  .arch-equity{background:#FCE7F3; color:#9D174D;}
  .arch-aging{background:#DCFCE7; color:#14532D;}
  .arch-governance{background:#E0E7FF; color:#3730A3;}
  .svr-pill{display:inline-block; padding:1px 6px; border-radius:3px; font-size:9.5px; font-weight:600; background:var(--bg-tint); color:var(--accent-d);}
  .top-product{color:var(--accent-d); font-weight:600; font-size:10.5px;}
  .table-footer-note{margin-top:10px; display:flex; justify-content:space-between; font-size:10px; color:var(--gray-1);}
  .table-footer-note .legend{display:flex; gap:10px; align-items:center;}
  .arch-grid{display:grid; grid-template-columns:2fr 2fr 2fr 2fr 1fr; gap:14px; flex:1;}
  .arch-card{background:white; border-radius:6px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;}
  .arch-card-header{padding:14px 16px; color:white;}
  .arch-card-header.academic{background:linear-gradient(135deg,#1E40AF,#3B82F6);}
  .arch-card-header.rare{background:linear-gradient(135deg,#92400E,#F59E0B);}
  .arch-card-header.equity{background:linear-gradient(135deg,#9D174D,#EC4899);}
  .arch-card-header.aging{background:linear-gradient(135deg,#14532D,#22C55E);}
  .arch-card-header.governance{background:linear-gradient(135deg,#3730A3,#6366F1);}
  .arch-card-header h3{font-size:13px; font-weight:700; margin-bottom:4px;}
  .arch-card-header .count{font-size:28px; font-weight:800; line-height:1;}
  .arch-card-header .count-label{font-size:9.5px; opacity:0.85; text-transform:uppercase; letter-spacing:0.06em;}
  .arch-region-list{padding:12px 16px; flex:1; display:flex; flex-direction:column; gap:6px;}
  .arch-region-list .region{font-size:11px; color:var(--navy); line-height:1.3; padding:4px 0; border-bottom:1px solid var(--line);}
  .arch-region-list .region:last-child{border-bottom:none;}
  .arch-card-footer{padding:10px 16px; background:var(--hl); font-size:10px; color:var(--gray-1); line-height:1.4; border-top:1px solid var(--line);}
  .heatmap-wrap{flex:1; overflow-y:auto; display:flex; flex-direction:column;}
  table.heatmap{width:100%; border-collapse:collapse; font-size:9.5px; table-layout:fixed;}
  table.heatmap thead th{background:white; color:var(--navy); padding:6px 4px; font-weight:600; text-align:center; border-bottom:2px solid var(--navy); vertical-align:bottom; font-size:9px;}
  table.heatmap thead th.region-col{text-align:left; padding-left:8px; width:14%;}
  table.heatmap tbody td{padding:6px 4px; text-align:center; color:var(--navy); font-variant-numeric:tabular-nums; border:1px solid white;}
  table.heatmap tbody td.region-cell{text-align:left; padding-left:8px; background:white !important; color:var(--navy); font-weight:600; font-size:10px; border-bottom:1px solid var(--line);}
  .heatmap-legend{display:flex; align-items:center; gap:16px; margin-top:14px; font-size:10px; color:var(--gray-1);}
  .heatmap-legend-bar{height:12px; width:240px; background:linear-gradient(90deg,white,var(--accent-l),var(--accent),var(--accent-d)); border-radius:2px; border:1px solid var(--line); position:relative;}
  .heatmap-legend-bar::after{content:'low to high percentile'; position:absolute; bottom:-16px; width:100%; text-align:center; font-size:9px; color:var(--gray-1);}
  .vac-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; flex:1; overflow:hidden;}
  .vac-col{background:white; border-radius:6px; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;}
  .vac-col-header{padding:14px 18px; background:linear-gradient(180deg,white,#FAFCFD); border-bottom:1px solid var(--line);}
  .vac-col-title{font-size:14px; font-weight:700; color:var(--navy);}
  .vac-col-product{font-size:10.5px; color:var(--gray-1); margin-top:2px;}
  .vac-col-summary{display:flex; gap:16px; margin-top:10px;}
  .vac-summary-item .label{font-size:9px; color:var(--gray-1); text-transform:uppercase; letter-spacing:0.06em;}
  .vac-summary-item .val{font-size:17px; font-weight:700; color:var(--navy); margin-top:2px; font-variant-numeric:tabular-nums;}
  .vac-col-body{flex:1; overflow:auto; padding:8px 12px;}
  .vac-row{display:flex; align-items:center; gap:10px; padding:4.5px 0; border-bottom:1px solid var(--line); font-size:10.5px;}
  .vac-row:last-child{border-bottom:none;}
  .vac-row .name{width:98px; color:var(--navy); font-weight:500; font-size:10px;}
  .vac-row .bar-wrap{flex:1; height:12px; background:var(--hl); border-radius:2px; overflow:hidden; position:relative;}
  .vac-row .bar{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-d)); border-radius:2px;}
  .vac-row .bar.weak{background:linear-gradient(90deg,#FCA5A5,#DC2626);}
  .vac-row .bar.medium{background:linear-gradient(90deg,#FCD34D,#F59E0B);}
  .vac-row .pct{width:40px; text-align:right; color:var(--navy); font-weight:600; font-variant-numeric:tabular-nums; font-size:10px;}
  .vac-callout{margin-top:14px; padding:10px 14px; background:var(--bg-tint); border-left:3px solid var(--accent); font-size:10.5px; color:var(--navy-soft); line-height:1.5; border-radius:3px;}
  .vac-callout strong{color:var(--navy);}
  .quad-wrap{flex:1; display:grid; grid-template-columns:1.4fr 1fr; gap:20px; overflow:hidden;}
  .quad-matrix{background:white; border-radius:6px; box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; overflow:hidden;}
  .quad-matrix-title{font-size:13px; font-weight:700; color:var(--navy); margin-bottom:12px;}
  .quad-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; flex:1;}
  .quad-cell{padding:14px; border-radius:5px; display:flex; flex-direction:column; justify-content:space-between; min-height:140px;}
  .quad-cell.priority{background:linear-gradient(135deg,#1E40AF,#3B82F6); color:white;}
  .quad-cell.engagement{background:linear-gradient(135deg,#92400E,#F59E0B); color:white;}
  .quad-cell.quickwin{background:linear-gradient(135deg,#14532D,#22C55E); color:white;}
  .quad-cell.deprio{background:#F3F4F6; color:var(--gray-1);}
  .quad-cell .cell-tag{font-size:9.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; opacity:0.85;}
  .quad-cell .cell-name{font-size:14px; font-weight:700; margin-top:4px;}
  .quad-cell .cell-num{font-size:48px; font-weight:800; line-height:1; margin:8px 0; font-variant-numeric:tabular-nums;}
  .quad-cell .cell-desc{font-size:10px; line-height:1.4; opacity:0.92;}
  .quad-cell.deprio .cell-tag, .quad-cell.deprio .cell-name{color:var(--navy);}
  .quad-cell.deprio .cell-num{color:var(--gray-1);}
  .quad-side{display:flex; flex-direction:column; gap:14px; overflow:hidden;}
  .quad-product-table{background:white; border-radius:6px; box-shadow:var(--shadow); flex:1; overflow:hidden; display:flex; flex-direction:column;}
  .quad-product-header{padding:12px 16px; border-bottom:1px solid var(--line);}
  .quad-product-header .ttl{font-size:13px; font-weight:700; color:var(--navy);}
  .quad-product-header .sub{font-size:10px; color:var(--gray-1); margin-top:2px;}
  .quad-product-body{flex:1; overflow-y:auto; padding:0;}
  .qpt{width:100%; border-collapse:collapse; font-size:10px;}
  .qpt th{position:sticky; top:0; background:var(--navy); color:white; padding:6px 8px; text-align:left; font-weight:600; font-size:9.5px;}
  .qpt th.numeric{text-align:right;}
  .qpt td{padding:5px 8px; border-bottom:1px solid var(--line); color:var(--navy); font-variant-numeric:tabular-nums;}
  .qpt td.numeric{text-align:right;}
  .qpt td.product{font-weight:600;}
  .qpt .pp{display:inline-block; padding:1px 5px; border-radius:8px; font-size:8.5px; font-weight:600;}
  .qpt .pp.priority{background:#DBEAFE; color:#1E40AF;}
  .qpt .pp.engagement{background:#FEF3C7; color:#92400E;}
  .qpt .pp.quickwin{background:#DCFCE7; color:#14532D;}
  .qpt .pp.deprio{background:#F3F4F6; color:#6B7280;}
  .gov-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:18px; flex:1; overflow:hidden;}
  .gov-card{background:white; border-radius:6px; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;}
  .gov-card-header{padding:14px 18px; background:var(--navy); color:white;}
  .gov-card-title{font-size:16px; font-weight:700; margin-bottom:4px;}
  .gov-card-subtitle{font-size:10.5px; opacity:0.85; line-height:1.4;}
  .gov-card-body{flex:1; padding:12px 16px; overflow-y:auto;}
  .gov-row{display:flex; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); gap:10px;}
  .gov-row:last-child{border-bottom:none;}
  .gov-name{font-size:11.5px; font-weight:600; color:var(--navy); flex:1;}
  .gov-role{font-size:10px; color:var(--gray-1); margin-top:2px; line-height:1.3;}
  .gov-tag{background:var(--accent-l); color:var(--accent-d); padding:2px 7px; border-radius:3px; font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; flex-shrink:0;}
  .gov-tag.warn{background:var(--gold-l); color:var(--gold);}
  .corner-grid{display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:1fr 1fr; gap:14px; flex:1;}
  .corner-card{background:white; border-radius:6px; box-shadow:var(--shadow); padding:16px 16px 12px; display:flex; flex-direction:column; position:relative; overflow:hidden; border-top:4px solid var(--accent);}
  .corner-card.cluster-norra{border-top-color:#92400E;}
  .corner-card.cluster-jonkoping{border-top-color:#15803D;}
  .corner-card.cluster-stockholm{border-top-color:#1E40AF;}
  .corner-card.cluster-mellan{border-top-color:#6366F1;}
  .corner-initials{width:36px; height:36px; border-radius:50%; background:var(--accent); color:white; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; margin-bottom:8px;}
  .corner-card.cluster-norra .corner-initials{background:#92400E;}
  .corner-card.cluster-jonkoping .corner-initials{background:#15803D;}
  .corner-card.cluster-stockholm .corner-initials{background:#1E40AF;}
  .corner-card.cluster-mellan .corner-initials{background:#6366F1;}
  .corner-name{font-size:14px; font-weight:700; color:var(--navy); line-height:1.2; margin-bottom:3px;}
  .corner-role{font-size:9.5px; color:var(--gray-1); line-height:1.4; margin-bottom:8px;}
  .corner-score{display:inline-block; background:var(--bg-tint); color:var(--accent-d); padding:2px 7px; border-radius:3px; font-size:9.5px; font-weight:700; margin-bottom:8px; align-self:flex-start;}
  .corner-note{font-size:10.5px; color:var(--navy-soft); line-height:1.5; flex:1; padding-top:8px; border-top:1px solid var(--line);}
  .corner-cluster-label{position:absolute; top:8px; right:12px; font-size:8.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--gray-1);}
  .intel-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; flex:1; align-content:start; overflow-y:auto; padding-right:6px;}
  .intel-card{background:white; border-radius:5px; box-shadow:var(--shadow); padding:12px 14px; border-left:3px solid var(--accent); display:flex; flex-direction:column; min-height:95px;}
  .intel-card.transition{border-left-color:var(--warn);}
  .intel-card.dual-role{border-left-color:var(--gold);}
  .intel-card.structural{border-left-color:var(--gray-1);}
  .intel-card.correction{border-left-color:var(--good);}
  .intel-tag{font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;}
  .intel-tag.transition{color:var(--warn);}
  .intel-tag.dual-role{color:var(--gold);}
  .intel-tag.structural{color:var(--gray-1);}
  .intel-tag.correction{color:var(--good);}
  .intel-title{font-size:11px; font-weight:700; color:var(--navy); line-height:1.3; margin-bottom:5px;}
  .intel-body{font-size:10.5px; color:var(--gray-1); line-height:1.5; flex:1;}
  .dmm-wrap{flex:1; overflow-y:auto; display:flex; flex-direction:column;}
  table.dmm{width:100%; border-collapse:collapse; font-size:10px;}
  table.dmm thead th{background:var(--navy); color:white; padding:9px 10px; font-weight:600; font-size:10.5px; text-align:left; position:sticky; top:0;}
  table.dmm thead th.region-col{width:13%;}
  table.dmm tbody td{padding:7px 10px; border-bottom:1px solid var(--line); color:var(--navy); vertical-align:middle;}
  table.dmm tbody td.region-cell{font-weight:600; font-size:11px; background:var(--hl);}
  table.dmm tbody tr:hover td{background:var(--accent-xl);}
  .dmm .name{font-size:10px; line-height:1.3;}
  .dmm .name.struct{color:var(--gray-1); font-style:italic; font-size:9.5px;}
  .arc-wrap{flex:1; display:grid; grid-template-columns:3fr 1.2fr; gap:24px; overflow:hidden;}
  .arc-chart-wrap{background:white; border-radius:6px; box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; overflow:hidden;}
  .arc-chart-title{font-size:14px; font-weight:700; color:var(--navy); margin-bottom:10px;}
  .arc-svg-wrap{flex:1; width:100%;}
  .arc-svg-wrap svg{width:100%; height:100%;}
  .arc-side{display:flex; flex-direction:column; gap:14px; overflow:hidden;}
  .arc-stat-card{background:white; border-left:4px solid var(--accent); border-radius:4px; padding:14px 16px; box-shadow:var(--shadow);}
  .arc-stat-card .delta{font-size:36px; font-weight:800; color:var(--warn); line-height:1; margin-bottom:4px;}
  .arc-stat-card .label{font-size:11.5px; color:var(--navy); font-weight:600; line-height:1.4;}

  .src-card .src-name{font-size:14px; font-weight:700; color:var(--navy); margin:3px 0 6px;}
  .src-card .src-prov{font-size:10px; color:var(--gray-1); line-height:1.45; flex:1;}
  .src-card .src-note{font-size:9.5px; color:var(--accent-d); margin-top:6px; padding-top:6px; border-top:1px solid var(--line); font-weight:600;}
  .convention-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .convention-card{background:var(--bg-tint); border-left:3px solid var(--accent); padding:12px 16px; border-radius:3px;}
  .convention-card .ctitle{font-size:11.5px; font-weight:700; color:var(--navy); margin-bottom:5px;}
  .convention-card .cbody{font-size:10.5px; color:var(--navy-soft); line-height:1.5;}

  /* Archetype feature signature */
  .archetype-fs{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:8px; flex:1;}
  .arch-fs-card{background:white; border-radius:5px; box-shadow:var(--shadow); padding:10px 12px; display:flex; flex-direction:column;}
  .arch-fs-name{font-size:11px; font-weight:700; line-height:1.2; color:var(--navy); margin-bottom:3px;}
  .arch-fs-card.academic{border-top:3px solid #1E40AF;} .arch-fs-card.academic .arch-fs-name{color:#1E40AF;}
  .arch-fs-card.rare{border-top:3px solid #92400E;} .arch-fs-card.rare .arch-fs-name{color:#92400E;}
  .arch-fs-card.equity{border-top:3px solid #9D174D;} .arch-fs-card.equity .arch-fs-name{color:#9D174D;}
  .arch-fs-card.aging{border-top:3px solid #14532D;} .arch-fs-card.aging .arch-fs-name{color:#14532D;}
  .arch-fs-feat{display:flex; align-items:center; gap:6px; padding:3px 0; font-size:9px;}
  .arch-fs-feat .l{width:60px; color:var(--gray-1); flex-shrink:0;}
  .arch-fs-feat .b{flex:1; height:6px; background:var(--hl); border-radius:1px; overflow:hidden;}
  .arch-fs-feat .b div{height:100%; background:var(--accent);}
  .arch-fs-card.academic .b div{background:#3B82F6;}
  .arch-fs-card.rare .b div{background:#F59E0B;}
  .arch-fs-card.equity .b div{background:#EC4899;}
  .arch-fs-card.aging .b div{background:#22C55E;}

  /* Influence stacked bar */
  .infl-bar-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:11px;}
  .infl-bar-row:last-child{border-bottom:none;}
  .infl-bar-row .name{width:130px; color:var(--navy); font-weight:600; font-size:11px;}
  .infl-bar-row .bar-wrap{flex:1; height:18px; background:var(--hl); border-radius:3px; display:flex; overflow:hidden;}
  .infl-bar-row .seg{height:100%; display:flex; align-items:center; justify-content:flex-end; padding-right:4px; color:white; font-size:9px; font-weight:600;}
  .infl-bar-row .seg.lk{background:#1E40AF;}
  .infl-bar-row .seg.nt{background:var(--accent-d);}
  .infl-bar-row .seg.nsg{background:#15803D;}
  .infl-bar-row .seg.hsd{background:#9D174D;}
  .infl-bar-row .seg.rd{background:#6366F1;}
  .infl-bar-row .total{width:50px; text-align:right; color:var(--navy); font-weight:700; font-size:11px; font-variant-numeric:tabular-nums;}
  .infl-legend{display:flex; gap:12px; margin-top:10px; font-size:9.5px; color:var(--gray-1); flex-wrap:wrap;}
  .infl-legend .swatch{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle;}

  /* Brick scatter */
  .brick-scatter-wrap{flex:1; background:white; border-radius:4px; padding:14px;}
  .brick-scatter-wrap svg{width:100%; height:100%;}
  .brick-scatter-legend{display:flex; gap:14px; font-size:10px; color:var(--gray-1); margin-top:8px;}
  .brick-scatter-legend .item{display:flex; align-items:center; gap:5px;}
  .brick-scatter-legend .dot{display:inline-block; width:10px; height:10px; border-radius:50%;}

  /* Tagged claims audit */
  .claims-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; flex:1;}
  .claim-card{background:white; border-radius:5px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; border-left:3px solid var(--accent);}
  .claim-card.observed{border-left-color:var(--good);}
  .claim-card.modeled{border-left-color:var(--accent-d);}
  .claim-card.hypothesis{border-left-color:var(--gold);}
  .claim-card.needs{border-left-color:var(--warn);}
  .claim-tag{display:inline-block; padding:2px 8px; border-radius:3px; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; align-self:flex-start; margin-bottom:8px;}
  .claim-tag.observed{background:var(--good-l); color:var(--good);}
  .claim-tag.modeled{background:var(--accent-l); color:var(--accent-d);}
  .claim-tag.hypothesis{background:var(--gold-l); color:var(--gold);}
  .claim-tag.needs{background:var(--warn-l); color:var(--warn);}
  .claim-text{font-size:11px; font-weight:600; color:var(--navy); line-height:1.4; margin-bottom:8px;}
  .claim-source{font-size:9.5px; color:var(--gray-1); line-height:1.4; padding-top:8px; border-top:1px solid var(--line); flex:1;}
  .claim-source strong{color:var(--navy);}
  .conf-tier-bar{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  .conf-tier-card{background:white; border-radius:5px; padding:12px 14px; border-top:3px solid var(--accent);}
  .conf-tier-card.observed{border-top-color:var(--good);}
  .conf-tier-card.modeled{border-top-color:var(--accent-d);}
  .conf-tier-card.hypothesis{border-top-color:var(--gold);}
  .conf-tier-card.needs{border-top-color:var(--warn);}
  .conf-tier-card .tname{font-size:11.5px; font-weight:700; color:var(--navy); margin-bottom:4px;}
  .conf-tier-card .tdesc{font-size:9.5px; color:var(--gray-1); line-height:1.4;}


  .dmm .name.unknown{color:var(--gold); font-style:italic; font-size:9.5px;}
  .dmm-legend{display:flex; gap:18px; margin-top:12px; font-size:10px; color:var(--gray-1); align-items:center; padding:8px 12px; background:var(--hl); border-radius:4px;}
  .dmm-legend-item{display:flex; align-items:center; gap:5px;}
  .dmm-legend-marker{font-style:italic; font-weight:600;}
  .dmm-legend-marker.struct{color:var(--gray-1);}
  .dmm-legend-marker.unknown{color:var(--gold);}

  /* Four layers slide */
  .layer-grid{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:14px; flex:1; overflow:hidden;}
  .layer-card{background:white; border-radius:6px; box-shadow:var(--shadow); border-top:4px solid var(--accent); padding:16px 20px; display:flex; flex-direction:column; overflow-y:auto;}
  .layer-card.observed{border-top-color:var(--good);}
  .layer-card.modeled{border-top-color:var(--accent-d);}
  .layer-card.hypothesis{border-top-color:var(--gold);}
  .layer-card.needs{border-top-color:var(--warn);}
  .layer-name{font-size:15px; font-weight:700; line-height:1;}
  .layer-name.observed{color:var(--good);}
  .layer-name.modeled{color:var(--accent-d);}
  .layer-name.hypothesis{color:var(--gold);}
  .layer-name.needs{color:var(--warn);}
  .layer-def{font-size:11.5px; color:var(--gray-1); margin:6px 0 10px; line-height:1.55;}
  .layer-examples-label{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--gray-1); margin-bottom:4px; padding-top:8px; border-top:1px solid var(--line);}
  .layer-example{font-size:10.5px; color:var(--navy-soft); line-height:1.5; padding:6px 0;}
  .layer-example::before{content:"▸ "; color:var(--accent);}
  .layer-example strong{color:var(--navy); font-weight:600;}
  .layer-foot{background:var(--bg-tint); border-left:3px solid var(--accent); padding:10px 16px; border-radius:3px; margin-top:12px; font-size:11px; color:var(--navy-soft); line-height:1.5;}

</style>

pushSlide(`<div class="slide"><div class="topbar"></div><div class="conf-strip">Confidential — General Business</div><div class="body"><div class="section-label">Methodology · 01</div><div class="slide-title">Data foundations</div><div class="slide-subtitle">Six sources combined into one analytical view · two normalization conventions applied throughout</div><div style="flex:1; display:flex; flex-direction:column; gap:14px; overflow:hidden"><div class="src-grid"><div class="src-card"><div class="src-num">SOURCE 01</div><div class="src-name">SCB</div><div class="src-prov">Population denominators · age + sex breakdown · GRP per capita · projections to 2040 + 2050 · foreign-born %</div><div class="src-note">Refreshes annually</div></div><div class="src-card"><div class="src-num">SOURCE 02</div><div class="src-name">Socialstyrelsen Läkemedelsregistret</div><div class="src-prov">Patient counts per region per year for any prescription drug by ATC · 2021–2024 pulled · excludes hospital-administered products</div><div class="src-note">Annual refresh; 12-month publication lag</div></div><div class="src-card"><div class="src-num">SOURCE 03</div><div class="src-name">IQVIA Sell-In (3 extracts)</div><div class="src-prov">Vaccines · RD/IM · Oncology · brick-level granularity · monthly Apr 2023 – Mar 2026 · sell-in SEK + units</div><div class="src-note">Authoritative for revenue + competitive share</div></div><div class="src-card"><div class="src-num">SOURCE 04</div><div class="src-name">Kolada + SKR</div><div class="src-prov">Healthcare cost per capita · primary care cost · specialists · wait times · quality KPIs · equity composite</div><div class="src-note">Quarterly + annual KPI cycles</div></div><div class="src-card"><div class="src-num">SOURCE 05</div><div class="src-name">samverkanlakemedel.se</div><div class="src-prov">NT-rådet recommendations + status · NSG composition · 21 LK ordföranden · canonical for governance</div><div class="src-note">Continuous update</div></div><div class="src-card"><div class="src-num">SOURCE 06</div><div class="src-name">AVA — patient-level data</div><div class="src-prov">Vydura IPD with Atogepant comparator · Ibrance + Vyndaqel aggregated patient counts · class-naive distinction · diagnostic-group splits</div><div class="src-note">CDK4/6 through Jan 2026; ATTR through Mar 2026</div></div></div><div class="convention-row"><div class="convention-card"><div class="ctitle">Per-100k normalization</div><div class="cbody">Every regional rate is computed as count divided by population × 100,000. This makes Norrbotten (249k pop) and Stockholm (2.5M pop) comparable on the same axis. Without per-100k, every ranking would just rediscover the population ranking instead of revealing where Pfizer is over- or under-indexed.</div></div><div class="convention-card"><div class="ctitle">SEK vs units convention</div><div class="cbody">IQVIA share is reported by SEK (revenue split) AND by units (dose-volume split). They diverge when one product is more expensive per pack than another. We always specify which window. Example: Abrysvo nationally is 64.5% by SEK but 56.8% by units. Stockholm Abrysvo is 45.6% MINORITY by units.</div></div></div></div></div><div class="foot"><span>Source: SCB · Socialstyrelsen · IQVIA · Kolada · SKR · samverkanlakemedel.se · Pfizer AVA</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`);

// M3: Trajectory verdicts (slope methodology)
pushSlide(`<div class="slide"><div class="topbar"></div><div class="conf-strip">Confidential — General Business</div><div class="body"><div class="section-label">Methodology · 02</div><div class="slide-title">Trajectory verdicts</div><div class="slide-subtitle">How we read whether a product is growing, plateauing, or declining over time</div><div class="method-wrap"><div class="method-pane"><div class="method-pane-header">The method</div><div class="method-pane-title">Compare the most recent six months to the six months before them</div><div class="formula-box"><div class="flabel">Slope</div><div class="feq" style="font-family:'Inter',sans-serif; font-size:13px; font-weight:500">Take the change from the prior 6&#8209;month window to the most recent 6&#8209;month window, expressed as a percentage of the prior window.</div><div class="fnote">Applied to monthly IQVIA data — units or SEK depending on the question. Each window is six consecutive months of data, so the comparison is rolling and self-correcting.</div></div><div class="method-pane-header" style="margin-top:10px">Verdict zones</div><div class="threshold-list"><div class="threshold-row compounding"><div class="name">Compounding</div><div class="range">grew more than +30%</div></div><div class="threshold-row growing"><div class="name">Growing</div><div class="range">grew +5% to +30%</div></div><div class="threshold-row plateauing"><div class="name">Plateauing</div><div class="range">moved less than ±5%</div></div><div class="threshold-row declining"><div class="name">Declining</div><div class="range">fell −5% to −20%</div></div><div class="threshold-row contracting"><div class="name">Contracting</div><div class="range">fell more than −20%</div></div></div><div class="formula-box" style="margin-top:8px"><div class="flabel">Robustness checks</div><div class="fnote">The verdict zones were sensitivity-tested at both ±5% and ±10% bands; most products land in the same zone under both. The slope method is NOT applied to vaccines, where seasonal patterns dominate any 6-month window.</div></div></div><div class="method-pane"><div class="method-pane-header">Worked example</div><div class="method-pane-title">Pfizer Ibrance · share of CDK4/6 market by SEK</div><div class="worked-step"><div class="worked-num">1</div><div class="worked-content"><strong>Most recent 6 months</strong> (October 2025 – March 2026): Ibrance held <strong>17.5%</strong> of CDK4/6 SEK in Sweden.</div></div><div class="worked-step"><div class="worked-num">2</div><div class="worked-content"><strong>Prior 6 months</strong> (April – September 2025): Ibrance held <strong>18.9%</strong>.</div></div><div class="worked-step"><div class="worked-num">3</div><div class="worked-content"><strong>The change.</strong> A drop of 1.4 percentage points, which is a relative change of <strong>−7.4%</strong> from the prior window.</div></div><div class="worked-step"><div class="worked-num">4</div><div class="worked-content"><strong>Apply the verdict zones.</strong> A −7.4% relative change sits inside the Declining band (−5% to −20%).</div></div><div class="worked-result"><div class="label">Verdict for the most recent window</div><div class="value">Declining</div></div></div></div></div><div class="foot"><span>Source: IQVIA Oncology Apr 2023 – Mar 2026 · monthly Sell-In SEK by drug</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`);

erstones</div><div class="method-pane-title">Each bar broken into role components</div><div style="flex:1"><div class="infl-bar-row"><div class="name">Jan Melin</div><div class="bar-wrap"><div class="seg lk" style="width:42%">LK 75</div><div class="seg nt" style="width:58%">NT 104.5</div></div><div class="total">179.5</div></div><div class="infl-bar-row"><div class="name">Pia Näsvall</div><div class="bar-wrap"><div class="seg nsg" style="width:55%">NSG 85</div><div class="seg hsd" style="width:45%">HSD 70</div></div><div class="total">155</div></div><div class="infl-bar-row"><div class="name">Rickard Malmström</div><div class="bar-wrap"><div class="seg nt" style="width:100%">NT 114</div></div><div class="total">114</div></div><div class="infl-bar-row"><div class="name">Johan Bratt</div><div class="bar-wrap"><div class="seg nsg" style="width:100%">NSG 102</div></div><div class="total">102</div></div><div class="infl-bar-row"><div class="name">Mårten Lindström</div><div class="bar-wrap"><div class="seg nt" style="width:100%">NT 99.8</div></div><div class="total">99.8</div></div><div class="infl-bar-row"><div class="name">Anders Bergström</div><div class="bar-wrap"><div class="seg nt" style="width:100%">NT 95</div></div><div class="total">95</div></div><div class="infl-bar-row"><div class="name">Maria Ekelund</div><div class="bar-wrap"><div class="seg lk" style="width:100%">LK 75</div></div><div class="total">75</div></div><div class="infl-bar-row"><div class="name">Mats Ek</div><div class="bar-wrap"><div class="seg lk" style="width:100%">LK 75</div></div><div class="total">75</div></div></div><div class="infl-legend"><span><span class="swatch" style="background:#1E40AF"></span>LK ordförande</span><span><span class="swatch" style="background:#1A7CA8"></span>NT-rådet rep</span><span><span class="swatch" style="background:#15803D"></span>NSG rep</span><span><span class="swatch" style="background:#9D174D"></span>HSD</span></div></div></div></div><div class="foot"><span>Source: samverkanlakemedel.se · regional health authorities · multi-role aggregation methodology</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`);

// M7: Brick priority
function buildBrickMethod() {
  const W = 540, H = 320;
  const pad = {l:50, r:30, t:20, b:50};
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  // X = brick total SEK (M kr) · Y = Ibrance share %
  const xMax = Math.max(...BRICK.top_recovery.map(b => b.total_sek/1e6), ...BRICK.defense.map(b => b.total_sek/1e6)) * 1.1;
  const yMax = 50;
  const xS = v => pad.l + (v/xMax)*innerW;
  const yS = v => pad.t + (1 - v/yMax)*innerH;

  // Threshold lines: x median (just for visual), y at 12.5% (Recovery threshold) and 17.5% (national mean)
  let grid = '';
  for (let v=0; v<=50; v+=10) {
    const y = yS(v);
    grid += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#E5E9EF" stroke-width="1"/>`;
    grid += `<text x="${pad.l-6}" y="${y+3}" text-anchor="end" fill="#9CA3AF" font-size="9">${v}%</text>`;
  }
  // X axis labels
  for (let v=0; v<=Math.floor(xMax); v+=4) {
    const x = xS(v);
    grid += `<line x1="${x}" y1="${H-pad.b}" x2="${x}" y2="${H-pad.b+4}" stroke="#9CA3AF"/>`;
    grid += `<text x="${x}" y="${H-pad.b+16}" text-anchor="middle" fill="#6B7280" font-size="9">${v}M</text>`;
  }

  // Threshold reference lines
  const y125 = yS(12.5);
  const y175 = yS(17.5);
  let refs = '';
  refs += `<line x1="${pad.l}" y1="${y125}" x2="${W-pad.r}" y2="${y125}" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  refs += `<text x="${W-pad.r-3}" y="${y125-3}" text-anchor="end" fill="#DC2626" font-size="9" font-weight="700">12.5% threshold (Recovery)</text>`;
  refs += `<line x1="${pad.l}" y1="${y175}" x2="${W-pad.r}" y2="${y175}" stroke="#1A7CA8" stroke-width="1" stroke-dasharray="2,2"/>`;
  refs += `<text x="${W-pad.r-3}" y="${y175-3}" text-anchor="end" fill="#1A7CA8" font-size="9">17.5% national</text>`;

  // Plot bricks
  let dots = '';
  for (const b of BRICK.top_recovery) {
    const x = xS(b.total_sek/1e6);
    const y = yS(b.ibrance_share);
    dots += `<circle cx="${x}" cy="${y}" r="6" fill="#DC2626" stroke="white" stroke-width="1.5" opacity="0.85"><title>${b.brick} — ${(b.total_sek/1e6).toFixed(1)}M, Ibrance ${b.ibrance_share}%, recovery ${(b.recovery_sek/1e6).toFixed(2)}M</title></circle>`;
  }
  for (const b of BRICK.defense) {
    const x = xS(b.total_sek/1e6);
    const y = yS(b.ibrance_share);
    dots += `<circle cx="${x}" cy="${y}" r="7" fill="#D97706" stroke="white" stroke-width="1.5" opacity="0.9"><title>${b.brick} — ${(b.total_sek/1e6).toFixed(1)}M, Ibrance ${b.ibrance_share}%, defense risk ${(b.defense_risk_sek/1e6).toFixed(2)}M</title></circle>`;
  }

  const bgDots = '';

  // Axis labels
  const axisLabels = `<text x="${pad.l + innerW/2}" y="${H-8}" text-anchor="middle" fill="#1B2944" font-size="10" font-weight="600">Brick CDK4/6 market size (M kr, last 6 months)</text><text transform="rotate(-90 12 ${pad.t + innerH/2})" x="12" y="${pad.t + innerH/2}" text-anchor="middle" fill="#1B2944" font-size="10" font-weight="600">Ibrance share %</text>`;

  const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${grid}${refs}${bgDots}${dots}${axisLabels}<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H-pad.b}" stroke="#1B2944" stroke-width="1.5"/><line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="#1B2944" stroke-width="1.5"/></svg>`;

  return `<div class="slide"><div class="topbar"></div><div class="conf-strip">Confidential — General Business</div><div class="body"><div class="section-label">Methodology · 05</div><div class="slide-title">Brick priority</div><div class="slide-subtitle">How 78 IQVIA commercial bricks get classified into Recovery + Defense + Stable + Low-priority quadrants</div><div class="method-wrap"><div class="method-pane"><div class="method-pane-header">Recovery criteria</div><div class="method-pane-title">Where Pfizer can win patients back</div><div class="formula-box"><div class="flabel">Recovery target if BOTH</div><div class="feq">brick_market_size > median<br>AND<br>ibrance_share < 12.5%</div><div class="fnote">12.5% is 5 points below the 17.5% national mean — a meaningful gap that's worth field-team time.</div></div><div class="formula-box"><div class="flabel">Recovery opportunity in kronor</div><div class="feq" style="font-family:\'Inter\',sans-serif; font-size:13px; font-weight:500">How far Pfizer\'s share at the brick is below the 17.5% national average · multiplied by the brick\'s total CDK4/6 SEK over the last 6 months.</div><div class="fnote">Quantifies how much SEK Pfizer would recover if the brick reverted to the national share. Total Sweden-wide opportunity across all 78 bricks: 9.3M kr.</div></div><div class="method-pane-header" style="margin-top:6px">Defense criteria</div><div class="formula-box"><div class="flabel">A brick qualifies as a Defense target when BOTH conditions hold</div><div class="feq" style="font-family:\'Inter\',sans-serif; font-size:13px; font-weight:500">Pfizer\'s share at the brick is above the national average · AND · Kisqali is growing more than +10% there.</div><div class="fnote">Defense-risk SEK is Kisqali\'s growth rate multiplied by the Ibrance SEK at risk. Three Defense bricks identified: Eskilstuna, Kristianstad, Sundsvall.</div></div></div><div class="method-pane"><div class="method-pane-header">Priority-brick scatter</div><div class="method-pane-title">Where the measured priority bricks sit on size × Ibrance share</div><div class="brick-scatter-wrap">${svg}</div><div class="brick-scatter-legend"><div class="item"><span class="dot" style="background:#DC2626"></span>Top 15 raw Recovery opportunities</div><div class="item"><span class="dot" style="background:#D97706"></span>3 Defense targets</div></div></div></div></div><div class="foot"><span>Source: IQVIA Oncology brick-level Apr 2023 – Mar 2026 · 78 bricks scored · F21 brick priority quadrant</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`;

// M8: Four layers of claims
pushSlide(`<div class="slide"><div class="topbar"></div><div class="conf-strip">Confidential — General Business</div><div class="body"><div class="section-label">Methodology · 06</div><div class="slide-title">Four layers of claims in this mapping</div><div class="slide-subtitle">How to read confidence in the analysis · what each layer means · examples from the work</div><div class="layer-grid"><div class="layer-card observed"><div class="layer-name observed">Observed</div><div class="layer-def">Direct measurement from a primary source. Refreshes automatically when the source refreshes. The bedrock of the analysis.</div><div class="layer-examples-label">Examples in this deck</div><div class="layer-example"><strong>Pfizer Ibrance share of CDK4/6 SEK fell from 58.6% (Apr-Sep 2023) to 17.5% (Oct 2025-Mar 2026)</strong> — direct rolling-window computation from IQVIA Oncology data.</div><div class="layer-example"><strong>Norrbotten Vyndaqel concentration: 31.0/100k</strong> — Socialstyrelsen 2024 patient counts ÷ SCB region population.</div><div class="layer-example"><strong>Eight cornerstone names with current roles</strong> — samverkanlakemedel.se canonical roster, externally cross-checked 2026-05-08.</div></div><div class="layer-card modeled"><div class="layer-name modeled">Modeled</div><div class="layer-def">Computed from observed inputs through an explicit formula. As strong as the inputs and as defensible as the formula. Sensitivity-tested where applicable.</div><div class="layer-examples-label">Examples in this deck</div><div class="layer-example"><strong>11 strict Recovery bricks; top 15 raw opportunities ~6M kr</strong> — Recovery SEK formula = (national share − brick share) × brick total. The 12.5% threshold is author-chosen.</div><div class="layer-example"><strong>Region × product priority quadrant (231 cells)</strong> — Opportunity × Actionability scoring with median-split classification.</div><div class="layer-example"><strong>Trajectory verdicts (Growing / Plateauing / Declining)</strong> — last-6 vs prior-6 month change with five verdict zones.</div></div><div class="layer-card hypothesis"><div class="layer-name hypothesis">Hypothesis</div><div class="layer-def">An interpretive overlay — a story we tell about why a pattern exists. Falsifiable. Could be wrong without the underlying data being wrong.</div><div class="layer-examples-label">Examples in this deck</div><div class="layer-example"><strong>The TTR V30M founder variant explains the Norrland ATTR-PN cluster</strong> — the cluster is observed; the genetic causation is hypothesised from Swedish genetics literature.</div><div class="layer-example"><strong>Stockholm formulary cost-pressure drives Kisqali preference</strong> — substitution direction is observed in IQVIA; the cost-driven motivation is hypothesised.</div><div class="layer-example"><strong>Stockholm Abrysvo unit-vs-SEK divergence reflects regional procurement pattern</strong> — both shares are observed; the structural explanation is hypothesised.</div></div><div class="layer-card needs"><div class="layer-name needs">Needs Pfizer validation</div><div class="layer-def">A claim that requires data Pfizer holds internally but Viti does not. These would deepen the analysis materially in the next conversation.</div><div class="layer-examples-label">Examples in this deck</div><div class="layer-example"><strong>Net revenue per oral Rx product</strong> — every revenue figure currently uses gross sell-in proxy, not net realised revenue. Pfizer Pricing input would tighten brick-recovery sizing.</div><div class="layer-example"><strong>Cornerstone field-team relationship-depth</strong> — the 8 cornerstones are correctly identified by role; the warmth of each existing Pfizer relationship is unknown to us.</div><div class="layer-example"><strong>Molecular subtype epidemiology</strong> — HER2+ brain mets, BRCA-mut mBC, ALK+ NSCLC are not in any Swedish public register; precision oncology sizing uses population denominators not subtype prevalence.</div></div></div><div class="layer-foot"><strong>Every claim in this deck sits in one of these four layers.</strong> The layer indicates how strongly to trust the claim — and what would have to change for the trust level to move. Observed claims need source refreshes. Modeled claims need formula audits. Hypothesis claims need confirmatory evidence. Validation-pending claims need the conversation in the closing slide.</div></div><div class="foot"><span>Source: confidence framework applied across all quantitative claims · audit-ready</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`);

egion ranges from <strong>6.5%</strong> in Gävleborg to <strong>51%</strong> in Halland — a national-only view would erase that geography. Regional analysis is the only unit where the work happens.</div></div></div></div></div><div class="foot"><span>Source: samverkanlakemedel.se · SCB regional structure</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`}

// 6: Heatmap
function buildHeatmap(){const products=[{key:'vyndaqel',label:'Vyndaqel'},{key:'ibrance',label:'Ibrance'},{key:'vydura',label:'Vydura'},{key:'tukysa',label:'Tukysa'},{key:'talzenna',label:'Talzenna'},{key:'lorviqua',label:'Lorviqua'},{key:'elrexfio',label:'Elrexfio'},{key:'xtandi',label:'Xtandi'},{key:'abrysvo',label:'Abrysvo'},{key:'prevenar20',label:'Prevenar 20'},{key:'fsme_vuxen',label:'FSME-IMMUN'}];const percentiles={};for(const p of products){const vals=DATA.map(r=>r[p.key]||0);const sorted=[...vals].sort((a,b)=>a-b);percentiles[p.key]=vals.map(v=>v===0?0:Math.round((sorted.indexOf(v)/(sorted.length-1))*100))}function pctColor(pct){if(pct===0)return'#FFFFFF';if(pct<25)return`rgba(188,227,242,${0.3+pct/100})`;if(pct<50)return`rgba(188,227,242,${0.5+pct/200})`;if(pct<75)return`rgba(42,157,208,${0.4+pct/250})`;return`rgba(26,124,168,${0.5+pct/200})`}const sortedData=[...DATA].sort((a,b)=>(b.pfizer_total_3yr||0)-(a.pfizer_total_3yr||0));const headers='<th class="region-col">Region</th>'+products.map(p=>`<th>${p.label}</th>`).join('')+'<th style="width:8%; text-align:right;">Total<br>3-yr SEK</th>';const rows=sortedData.map(r=>{const dataIdx=DATA.indexOf(r);const cells=products.map(p=>{const pct=percentiles[p.key][dataIdx];const sek=r[p.key];const cellLabel=sek?(sek/1e6).toFixed(0):'—';const fontColor=pct>65?'white':'var(--navy)';return`<td style="background:${pctColor(pct)}; color:${fontColor}" title="${p.label}: ${cellLabel}M kr (P${pct})">${cellLabel}</td>`}).join('');const total=r.pfizer_total_3yr?(r.pfizer_total_3yr/1e6).toFixed(0)+'M':'—';return`<tr><td class="region-cell">${r.short}</td>${cells}<td style="text-align:right; font-weight:700;">${total}</td></tr>`}).join('');return`<div class="slide"><div class="topbar"></div><div class="conf-strip">Confidential — General Business</div><div class="body"><div class="section-label">Part A · The Mapping</div><div class="slide-title">Pfizer SEK by region and product</div><div class="slide-subtitle">21 regions × 11 priority products · cell colour = within-product percentile rank · cell value = 3-yr cumulative SEK in millions</div><div class="heatmap-wrap"><table class="heatmap"><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table><div class="heatmap-legend"><div class="heatmap-legend-bar"></div><div style="margin-left:24px"><strong style="color:var(--navy)">Read it like this:</strong> dark cells in a column = top regions for that product. Vyndaqel concentrates in Norrbotten + Västerbotten (V30M founder cluster). Xtandi spreads broadly. Vydura geography differs from migraine-incidence geography — Uppsala is the structural anomaly.</div></div></div></div><div class="foot"><span>Source: IQVIA Sell-In Apr 2023 – Mar 2026</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`}

function buildVac(){const swedenRSV=DATA.reduce((s,r)=>s+(r.abrysvo||0),0);const swedenPneu=DATA.reduce((s,r)=>s+(r.prevenar20||0),0);const swedenTBE=DATA.reduce((s,r)=>s+(r.fsme_vuxen||0)+(r.fsme_junior||0),0);const totalPop=DATA.reduce((s,r)=>s+(r.pop||0),0);const avgRSV=DATA.reduce((s,r)=>s+(r.rsv_share||0)*(r.pop||0),0)/totalPop;const avgPneu=DATA.reduce((s,r)=>s+(r.pneu_share||0)*(r.pop||0),0)/totalPop;const avgTBE=DATA.reduce((s,r)=>s+(r.tbe_share||0)*(r.pop||0),0)/totalPop;function bars(field){const sorted=[...DATA].sort((a,b)=>(b[field]||0)-(a[field]||0));return sorted.map(r=>{const v=r[field]||0;const cls=v<25?'weak':v<60?'medium':'';return`<div class="vac-row"><div class="name">${r.short}</div><div class="bar-wrap"><div class="bar ${cls}" style="width:${v}%"></div></div><div class="pct">${v.toFixed(1)}%</div></div>`}).join('')}return`<div class="slide"><div class="topbar"></div><div class="conf-strip">Confidential — General Business</div><div class="body"><div class="section-label">Part A · The Mapping</div><div class="slide-title">Vaccine landscape across the 21 regions</div><div class="slide-subtitle">Pfizer share by SEK in three vaccine classes · each row = one region · IQVIA Sell-In 36-month rolling</div><div class="vac-grid"><div class="vac-col"><div class="vac-col-header"><div class="vac-col-title">RSV adult — Abrysvo</div><div class="vac-col-product">Pfizer's RSV vaccine for adults 60+ · GSK Arexvy is the competitor</div><div class="vac-col-summary"><div class="vac-summary-item"><div class="label">National avg.</div><div class="val">${avgRSV.toFixed(1)}%</div></div><div class="vac-summary-item"><div class="label">Pfizer SEK 3yr</div><div class="val">${(swedenRSV/1e6).toFixed(0)}M kr</div></div></div></div><div class="vac-col-body">${bars('rsv_share')}</div></div><div class="vac-col"><div class="vac-col-header"><div class="vac-col-title">Pneumococcal — Prevenar 20</div><div class="vac-col-product">Pfizer's biggest competitive vulnerability · MSD Vaxneuvance + Capvaxive dominate</div><div class="vac-col-summary"><div class="vac-summary-item"><div class="label">National avg.</div><div class="val">${avgPneu.toFixed(1)}%</div></div><div class="vac-summary-item"><div class="label">Pfizer SEK 3yr</div><div class="val">${(swedenPneu/1e6).toFixed(0)}M kr</div></div></div></div><div class="vac-col-body">${bars('pneu_share')}</div></div><div class="vac-col"><div class="vac-col-header"><div class="vac-col-title">TBE — FSME-IMMUN</div><div class="vac-col-product">Endemic geography · ENCEPUR (Bavarian Nordic) the residual challenger</div><div class="vac-col-summary"><div class="vac-summary-item"><div class="label">National avg.</div><div class="val">${avgTBE.toFixed(1)}%</div></div><div class="vac-summary-item"><div class="label">Pfizer SEK 3yr</div><div class="val">${(swedenTBE/1e6).toFixed(0)}M kr</div></div></div></div><div class="vac-col-body">${bars('tbe_share')}</div></div></div><div class="vac-callout"><strong>Three structural realities at a glance.</strong> Abrysvo holds &gt;60% in most regions but Stockholm is the structural anomaly (45.6% MINORITY by units, vs 64.5% by SEK nationally — Arexvy leads by units in Stockholm). Prevenar 20 sits below 25% almost everywhere — pneumococcal is Pfizer's biggest competitive vulnerability. FSME-IMMUN dominates in TBE-endemic regions but Västmanland (24.3%) and Örebro (23.9%) are below-pattern outliers warranting investigation.</div></div><div class="foot"><span>Source: IQVIA Vaccines Apr 2023 – Mar 2026 · Folkhälsomyndigheten endemicity data</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`}
pushSlide(buildVac());

function buildQuadrant(){const prodTable=[...QUAD].sort((a,b)=>b.priority_focus-a.priority_focus);const productRows=prodTable.map(p=>`<tr><td class="product">${p.product}</td><td class="numeric"><span class="pp priority">${p.priority_focus}</span></td><td class="numeric"><span class="pp engagement">${p.engagement_build}</span></td><td class="numeric"><span class="pp quickwin">${p.quick_win}</span></td><td class="numeric"><span class="pp deprio">${p.deprioritize}</span></td></tr>`).join('');return`<div class="slide"><div class="topbar"></div><div class="conf-strip">Confidential — General Business</div><div class="body"><div class="section-label">Part A · The Mapping</div><div class="slide-title">Region × product priority quadrant</div><div class="slide-subtitle">231 region × product cells scored on Opportunity (size of gap to national rate) × Actionability (governance leverage + alignment)</div><div class="quad-wrap"><div class="quad-matrix"><div class="quad-matrix-title">The matrix · 231 cells distributed across four quadrants</div><div class="quad-grid"><div class="quad-cell priority"><div><div class="cell-tag">High opportunity · High actionability</div><div class="cell-name">Priority focus</div></div><div class="cell-num">70</div><div class="cell-desc">Concentrate field-team time. Vyndaqel + Tukysa + Paxlovid lead.</div></div><div class="quad-cell quickwin"><div><div class="cell-tag">Lower opportunity · High actionability</div><div class="cell-name">Quick win</div></div><div class="cell-num">46</div><div class="cell-desc">Small absolute gain but low effort. Prevenar 20 + Ibrance dominant.</div></div><div class="quad-cell engagement"><div><div class="cell-tag">High opportunity · Low actionability</div><div class="cell-name">Engagement build</div></div><div class="cell-num">24</div><div class="cell-desc">Invest in relationship before the gain ripens. Elrexfio + Abrysvo.</div></div><div class="quad-cell deprio"><div><div class="cell-tag">Low opportunity · Low actionability</div><div class="cell-name">Deprioritize</div></div><div class="cell-num">91</div><div class="cell-desc">Minimal investment. Defaults to monitoring + annual refresh.</div></div></div></div><div class="quad-side"><div class="quad-product-table"><div class="quad-product-header"><div class="ttl">Per-product distribution</div><div class="sub">Where each product's 21 region-cells sit · sorted by Priority focus count</div></div><div class="quad-product-body"><table class="qpt"><thead><tr><th>Product</th><th class="numeric">Pri.</th><th class="numeric">Eng.</th><th class="numeric">Quick</th><th class="numeric">Depr.</th></tr></thead><tbody>${productRows}</tbody></table></div></div></div></div></div><div class="foot"><span>Source: Opportunity score = (national rate − regional rate) × population · Actionability = governance leverage + alignment with regional plans</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`}

oes not exist as a single seat in this region</span></div><div class="dmm-legend-item"><span class="dmm-legend-marker unknown">verify</span><span>= role exists but incumbent unconfirmed in our cycle</span></div></div></div></div><div class="foot"><span>Source: samverkanlakemedel.se · regional official websites</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`}

// 13: Share arc
function buildArc(){const W=760,H=360;const pad={l:50,r:90,t:30,b:40};const innerW=W-pad.l-pad.r,innerH=H-pad.t-pad.b;const xScale=i=>pad.l+(i/(ARC.length-1))*innerW;const yScale=v=>pad.t+(1-v/70)*innerH;const lineFor=(key,color)=>{const points=ARC.map((d,i)=>`${xScale(i)},${yScale(d[key])}`).join(' ');return`<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`};let grid='';for(let v=0;v<=70;v+=10){const y=yScale(v);grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#E5E9EF" stroke-width="1"/>`;grid+=`<text x="${pad.l-8}" y="${y+3}" text-anchor="end" fill="#9CA3AF" font-size="10">${v}%</text>`}const xLabels=[{idx:0,label:'Sep 2023'},{idx:12,label:'Sep 2024'},{idx:24,label:'Sep 2025'},{idx:ARC.length-1,label:'Mar 2026'}];let xAxisTicks='';for(const{idx,label}of xLabels){const x=xScale(idx);xAxisTicks+=`<line x1="${x}" y1="${H-pad.b}" x2="${x}" y2="${H-pad.b+5}" stroke="#9CA3AF"/>`;xAxisTicks+=`<text x="${x}" y="${H-pad.b+18}" text-anchor="middle" fill="#6B7280" font-size="10">${label}</text>`}const last=ARC[ARC.length-1];const endpoints=[{y:yScale(last.ibrance),label:`Ibrance ${last.ibrance}%`,color:'#DC2626'},{y:yScale(last.kisqali),label:`Kisqali ${last.kisqali}%`,color:'#6B7280'},{y:yScale(last.verzenios),label:`Verzenios ${last.verzenios}%`,color:'#1A7CA8'}];const endpointLabels=endpoints.map(e=>`<text x="${W-pad.r+8}" y="${e.y+3}" fill="${e.color}" font-size="11" font-weight="700">${e.label}</text>`).join('');const start=ARC[0];const startLabel=`<text x="${xScale(0)+6}" y="${yScale(start.ibrance)-6}" fill="#DC2626" font-size="11" font-weight="700">Ibrance ${start.ibrance}%</text>`;const svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${grid}${lineFor('verzenios','#1A7CA8')}${lineFor('kisqali','#9CA3AF')}${lineFor('ibrance','#DC2626')}${endpointLabels}${startLabel}${xAxisTicks}<line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="#1B2944" stroke-width="1.5"/></svg>`;return`<div class="slide"><div class="topbar"></div><div class="conf-strip">Confidential — General Business</div><div class="body"><div class="section-label">Part C · Strategic Synthesis</div><div class="slide-title">Ibrance CDK4/6 share collapse over 36 months</div><div class="slide-subtitle">Pfizer's CDK4/6 SEK share fell from 58.6% to 17.5% · rolling 6-month window · IQVIA Oncology Apr 2023 – Mar 2026</div><div class="arc-wrap"><div class="arc-chart-wrap"><div class="arc-chart-title">Rolling 6-month SEK share by drug · Sweden national</div><div class="arc-svg-wrap">${svg}</div></div><div class="arc-side"><div class="arc-stat-card"><div class="delta">−41<span style="font-size:22px"> pp</span></div><div class="label">Pfizer's share fall, Apr-Sep 2023 → Oct 2025-Mar 2026</div><div class="detail">The 28% Pfizer share figure used in earlier briefings is the 36-month historical average; <strong>17.5%</strong> is the present-state. Forward-looking sizing should anchor on 17.5%.</div></div><div class="arc-window-table"><div class="table-title">Three windows side-by-side</div><table><thead><tr><th class="window" style="text-align:left">Window</th><th>Ibrance</th><th>Kisqali</th><th>Verzenios</th></tr></thead><tbody><tr><td class="window">Apr–Sep 2023</td><td class="ibrance">58.6%</td><td class="kisqali">29.0%</td><td class="verzenios">12.5%</td></tr><tr><td class="window">Apr–Sep 2025</td><td class="ibrance">18.9%</td><td class="kisqali">29.8%</td><td class="verzenios">51.3%</td></tr><tr><td class="window">Oct 2025–Mar 2026</td><td class="ibrance">17.5%</td><td class="kisqali">32.4%</td><td class="verzenios">50.1%</td></tr></tbody></table></div></div></div></div><div class="foot"><span>Source: IQVIA Oncology Apr 2023 – Mar 2026 · rolling 6-month SEK share by drug</span><span class="center">Internal Use Only</span><span class="brand">Viti Science</span></div></div>`}
pushSlide(buildArc());

let current = 0;
function fitScale(){
  const sw=window.innerWidth, sh=window.innerHeight;
  const scale = Math.min(sw/1280, (sh-60)/720);
  slides.forEach(s=>{ s.style.transform = `scale(${scale})`; });
}
window.addEventListener('resize', fitScale);
fitScale();

function goto(i){
  current = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,j)=>s.classList.toggle('active', j===current));
  document.querySelectorAll('.nav-dot').forEach((d,j)=>d.classList.toggle('active', j===current));
  document.getElementById('counter').textContent = `${current+1} / ${slides.length}`;
}
goto(0);
document.getElementById('prev').addEventListener('click', ()=>goto(current-1));
document.getElementById('next').addEventListener('click', ()=>goto(current+1));
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); goto(current+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); goto(current-1); }
  else if(e.key==='Home') goto(0);
  else if(e.key==='End') goto(slides.length-1);
});
document.addEventListener('click', e=>{
  if(e.target.closest('.nav-bar, .nav-dot, .nav-arrow, table, button, a, input, .corner-card, .intel-card, .quad-cell, svg, .scoretable-wrap, .dmm-wrap')) return;
  if(e.target.closest('.slide')) goto(current+1);
});

function attachTableSort(){
  const tbl = document.getElementById('scoretable');
  if(!tbl) return;
  let sortKey='pfizer_total_3yr', sortDir=-1;
  tbl.querySelectorAll('thead th').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.sort;
      if(key===sortKey) sortDir = -sortDir;
      else { sortKey=key; sortDir = (key==='short'||key==='svr'||key==='top_product'||key==='archetype') ? 1 : -1; }
      const rows = Array.from(tbl.querySelectorAll('tbody tr'));
      rows.sort((a,b)=>{
        const ra = DATA.find(d=>d.region===a.dataset.region);
        const rb = DATA.find(d=>d.region===b.dataset.region);
        let va=ra[sortKey], vb=rb[sortKey];
        if(typeof va==='string' && typeof vb==='string') return va.localeCompare(vb)*sortDir;
        if(va==null) va=-Infinity;
        if(vb==null) vb=-Infinity;
        return (va-vb)*sortDir;
      });
      const tbody = tbl.querySelector('tbody');
      rows.forEach(r=>tbody.appendChild(r));
    });
  });
}
attachTableSort();
